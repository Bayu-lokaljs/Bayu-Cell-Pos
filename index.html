<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bayu Cell - Premium POS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-body: #0f172a;
        --bg-container: #1e293b;
        --primary-color: #8b5cf6;
        --secondary-color: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --success-color: #10b981;
        --danger-color: #ef4444;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg-body);
        background-image: radial-gradient(
          circle at top right,
          #1e1b4b,
          var(--bg-body)
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
        margin: 0;
        color: var(--text-main);
      }

      .container {
        background: var(--bg-container);
        width: 100%;
        max-width: 900px;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-sizing: border-box;
      }

      h2 {
        color: var(--primary-color);
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 2px solid rgba(139, 92, 246, 0.3);
        padding-bottom: 10px;
      }

      .section-title {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin: 20px 0 10px;
      }

      .list-harga {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        max-height: 180px;
        overflow-y: auto;
        padding: 10px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .item {
        background: #334155;
        padding: 8px;
        border-radius: 8px;
        font-size: 0.75rem;
        border-left: 3px solid var(--primary-color);
      }

      /* Responsive Input Group */
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      @media (min-width: 600px) {
        .input-group {
          flex-direction: row;
        }
      }

      input {
        background: #0f172a;
        padding: 12px;
        border: 1px solid #334155;
        border-radius: 10px;
        color: white;
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
      }

      .btn-main {
        width: 100%;
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }

      /* Tabel Responsif (Penting!) */
      .table-container {
        width: 100%;
        overflow-x: auto; /* Biar bisa di-geser kalau layarnya super sempit */
        border-radius: 12px;
        border: 1px solid #334155;
        background: #1e293b;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 500px; /* Biar isi tabel gak tumpuk-tumpukan */
      }

      th {
        background: #0f172a;
        color: var(--primary-color);
        padding: 12px;
        font-size: 0.8rem;
      }
      td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #334155;
        font-size: 0.85rem;
      }

      .btn-hapus {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: 1px solid #ef4444;
        padding: 4px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.75rem;
      }

      #totalCuan .profit-card {
        background: linear-gradient(to right, #065f46, #059669);
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        margin-top: 20px;
        font-weight: 600;
      }

      .btn-reset {
        background: transparent;
        border: 1px solid var(--danger-color);
        color: var(--danger-color);
        margin-top: 30px;
        padding: 10px;
        width: 100%;
        border-radius: 10px;
        cursor: pointer;
      }

      #struk {
        text-align: center;
        padding: 12px;
        background: rgba(16, 185, 129, 0.1);
        color: var(--success-color);
        border: 1px solid var(--success-color);
        border-radius: 10px;
        margin: 15px 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>BAYU CELL POS</h2>

      <div class="section-title">📦 Daftar Harga Produk</div>
      <div id="tampilanHarga" class="list-harga"></div>

      <div class="section-title">✍️ Input Transaksi</div>
      <div class="input-group">
        <input
          type="text"
          id="namaProduk"
          list="saranProduk"
          oninput="cekHarga()"
          onfocus="this.value=''"
          placeholder="Ketik nama produk..."
          autocomplete="off"
        />
        <input type="number" id="nominal" placeholder="Harga Jual" />
        <input type="number" id="admin" placeholder="Profit" />
      </div>
      <datalist id="saranProduk"></datalist>

      <button class="btn-main" onclick="tambahTransaksi()">
        🚀 SIMPAN TRANSAKSI
      </button>
      <div id="struk"></div>

      <div class="section-title">📊 Riwayat Hari Ini</div>
      <div class="table-container">
        <table id="riwayatTransaksi"></table>
      </div>

      <div id="totalCuan"></div>
      <button class="btn-reset" onclick="resetData()">📁 BUKA BUKU BARU</button>
    </div>

    <script src="B6.js"></script>
  </body>
</html>
