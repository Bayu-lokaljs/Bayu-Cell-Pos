<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bayu Cell - Premium POS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-body: #0f172a; /* Warna background luar (Gelap) */
        --bg-container: #1e293b; /* Warna kotak utama */
        --primary-color: #8b5cf6; /* Ungu Neon */
        --secondary-color: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --success-color: #10b981;
        --danger-color: #ef4444;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--bg-body);
        background-image: radial-gradient(
          circle at top right,
          #1e1b4b,
          var(--bg-body)
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
        margin: 0;
        color: var(--text-main);
      }

      .container {
        background: var(--bg-container);
        width: 100%;
        max-width: 900px;
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      h2 {
        color: var(--primary-color);
        text-align: center;
        font-weight: 600;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 3px;
        border-bottom: 2px solid rgba(139, 92, 246, 0.3);
        padding-bottom: 15px;
      }

      .section-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 25px 0 12px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Daftar Harga Grid - Dark Version */
      .list-harga {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        max-height: 200px;
        overflow-y: auto;
        padding: 15px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 30px;
      }

      .item {
        background: #334155;
        padding: 10px;
        border-radius: 10px;
        font-size: 0.85rem;
        color: #e2e8f0;
        border-left: 4px solid var(--primary-color);
        transition: 0.2s;
      }

      .item:hover {
        background: #475569;
      }

      /* Form Input - Dark Version */
      .input-group {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
      }

      input {
        background: #0f172a;
        padding: 15px;
        border: 1px solid #334155;
        border-radius: 12px;
        outline: none;
        font-family: inherit;
        color: white;
        transition: 0.3s;
      }

      input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
      }

      /* Buttons */
      .btn-main {
        width: 100%;
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 18px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn-main:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      }

      .btn-reset {
        background: transparent;
        border: 1px solid #ef4444;
        color: #ef4444;
        margin-top: 40px;
      }

      .btn-reset:hover {
        background: #ef4444;
        color: white;
      }

      /* Struk Preview */
      #struk {
        text-align: center;
        padding: 15px;
        background: rgba(16, 185, 129, 0.1);
        color: var(--success-color);
        border: 1px solid var(--success-color);
        border-radius: 10px;
        margin: 20px 0;
        display: none;
      }

      /* Table Riwayat - Dark Version */
      .table-container {
        margin-top: 10px;
        border-radius: 15px;
        overflow: hidden;
        border: 1px solid #334155;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #1e293b;
      }

      th {
        background: #0f172a;
        color: var(--primary-color);
        padding: 15px;
        text-align: center;
      }

      td {
        padding: 15px;
        text-align: center;
        border-bottom: 1px solid #334155;
        color: #cbd5e1;
      }

      /* Total Profit Card */
      #totalCuan .profit-card {
        background: linear-gradient(to right, #065f46, #059669);
        color: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        margin-top: 25px;
        font-size: 1.2rem;
        font-weight: 600;
      }

      /* Hapus Button */
      .btn-hapus {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border: 1px solid #ef4444;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
      }

      .btn-hapus:hover {
        background: #ef4444;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>BAYU CELL POS</h2>

      <div class="section-title">📦 Daftar Harga Produk</div>
      <div id="tampilanHarga" class="list-harga"></div>

      <div class="section-title">✍️ Input Transaksi Baru</div>
      <div class="input-group">
        <input
          type="text"
          id="namaProduk"
          list="saranProduk"
          oninput="cekHarga()"
          placeholder="Cari Produk..."
        />
        <input type="number" id="nominal" placeholder="Harga Jual" />
        <input type="number" id="admin" placeholder="Profit (Admin)" />
      </div>
      <datalist id="saranProduk"></datalist>

      <button class="btn-main" onclick="tambahTransaksi()">
        🚀 CETAK STRUK & SIMPAN
      </button>

      <div id="struk"></div>

      <div class="section-title">📊 Riwayat Penjualan Hari Ini</div>
      <div class="table-container" id="riwayatTransaksi"></div>

      <div id="totalCuan"></div>

      <button class="btn-main btn-reset" onclick="resetData()">
        📁 BUKA BUKU BARU (RESET)
      </button>
    </div>

    <script src="B6.js"></script>
  </body>
</html>
